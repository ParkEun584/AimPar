<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 로우폴리 에임 트레이너</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Malgun Gothic', sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        h1, p { margin: 5px 0; }
        #scoreBoard { font-size: 28px; font-weight: bold; }
        #accuracyBoard { font-size: 24px; color: #ffeb3b; font-weight: bold; }
        #ammoBoard { font-size: 24px; color: #4CAF50; }
        #reloadMsg {
            color: #ff4444;
            font-size: 24px;
            font-weight: bold;
            display: none;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            cursor: pointer;
        }
        #instructions {
            text-align: center;
            font-size: 20px;
            line-height: 1.5;
        }
        .highlight { color: #ffeb3b; font-weight: bold; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    
    <div id="ui">
        <div id="scoreBoard">점수: <span id="score">0</span></div>
        <div id="accuracyBoard">명중률: <span id="accuracy">100.0</span>%</div>
        <div id="ammoBoard">총알: <span id="ammo">10</span> / 10</div>
        <div id="reloadMsg">재장전 필요! (R 키)</div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h1 style="font-size: 40px; margin-bottom: 20px;">3D 에임 트레이너</h1>
            <p>화면을 <span class="highlight">클릭</span>하여 게임을 시작하세요.</p>
            <p>마우스: 시점 이동 및 조준</p>
            <p>좌클릭: 사격</p>
            <p>R 키: 재장전</p>
            <p style="font-size: 14px; margin-top:20px; color:#aaa;">(ESC를 누르면 마우스 잠금이 해제됩니다)</p>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gunGroup = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(0.1, 0.1, 0.4);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const gunBody = new THREE.Mesh(bodyGeo, bodyMat);
        gunGroup.add(gunBody);

        const barrelGeo = new THREE.BoxGeometry(0.06, 0.06, 0.3);
        const barrelMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const gunBarrel = new THREE.Mesh(barrelGeo, barrelMat);
        gunBarrel.position.set(0, 0.02, -0.3);
        gunGroup.add(gunBarrel);

        const gripGeo = new THREE.BoxGeometry(0.08, 0.2, 0.1);
        const gripMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const gunGrip = new THREE.Mesh(gripGeo, gripMat);
        gunGrip.position.set(0, -0.12, 0.1);
        gunGrip.rotation.x = Math.PI / 8;
        gunGroup.add(gunGrip);

        gunGroup.position.set(0.3, -0.25, -0.6);
        camera.add(gunGroup);
        scene.add(camera);

        // 변수 추가: 총 발사 횟수 및 명중 횟수
        let score = 0;
        let totalShots = 0;
        const maxAmmo = 10;
        let ammo = maxAmmo;
        let targets = [];
        let recoil = 0;

        const scoreEl = document.getElementById('score');
        const accuracyEl = document.getElementById('accuracy');
        const ammoEl = document.getElementById('ammo');
        const reloadMsgEl = document.getElementById('reloadMsg');
        const ammoBoardEl = document.getElementById('ammoBoard');

        function spawnTarget() {
            const size = Math.random() * 1 + 0.5;
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshLambertMaterial({ color: 0xff3333 });
            const target = new THREE.Mesh(geometry, material);
            
            target.position.x = (Math.random() - 0.5) * 20;
            target.position.y = Math.random() * 5 - 1;
            target.position.z = -(Math.random() * 15 + 10);

            target.castShadow = true;
            scene.add(target);
            targets.push(target);
        }

        for(let i=0; i<3; i++) spawnTarget();

        const raycaster = new THREE.Raycaster();
        const centerScreen = new THREE.Vector2(0, 0);

        const blocker = document.getElementById('blocker');
        
        blocker.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                blocker.style.display = 'none';
            } else {
                blocker.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                const movementX = e.movementX || 0;
                const movementY = e.movementY || 0;

                camera.rotation.y -= movementX * 0.002;
                camera.rotation.x -= movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        });

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;

            if (ammo > 0) {
                ammo--;
                totalShots++; // 총 발사 수 증가
                ammoEl.textContent = ammo;
                
                if (ammo <= 3) ammoBoardEl.style.color = '#ff9800';
                else ammoBoardEl.style.color = '#4CAF50';
                
                if (ammo === 0) {
                    reloadMsgEl.style.display = 'block';
                    ammoBoardEl.style.color = '#ff4444';
                }

                recoil = 1.0;

                raycaster.setFromCamera(centerScreen, camera);
                const intersects = raycaster.intersectObjects(targets);

                if (intersects.length > 0) {
                    const hitTarget = intersects[0].object;
                    scene.remove(hitTarget);
                    targets = targets.filter(t => t !== hitTarget);
                    
                    score++; // 명중 수 증가
                    scoreEl.textContent = score;
                    spawnTarget();
                }

                // 명중률 계산 (소수점 첫째 자리까지)
                const accuracy = ((score / totalShots) * 100).toFixed(1);
                accuracyEl.textContent = accuracy;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && ammo < maxAmmo) {
                ammo = maxAmmo;
                ammoEl.textContent = ammo;
                ammoBoardEl.style.color = '#4CAF50';
                reloadMsgEl.style.display = 'none';
                gunGroup.position.y = -0.4; 
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            if (recoil > 0) {
                recoil -= 0.1;
                gunGroup.position.z = -0.6 + (recoil * 0.1);
                gunGroup.rotation.x = recoil * 0.2;
            } else {
                gunGroup.position.z = -0.6;
                gunGroup.rotation.x = 0;
            }
            
            if (gunGroup.position.y < -0.25) {
                gunGroup.position.y += 0.01;
            }

            targets.forEach(target => {
                target.rotation.x += 0.01;
                target.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
